<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
    <title>Register</title>
</head>
<body class="font-sans bg-gray-100 flex items-center justify-center h-screen m-0 text-gray-800">
    <div class="bg-white p-5 rounded-lg shadow-lg w-72">
        <h1 class="font-bold text-3xl mb-5 text-gray-800">Register</h1>
        <form id="registerForm">
            <label for="usernameInput" class="block">Username</label>
            <input type="text" id="usernameInput" minlength="3" required
                   class="w-full p-2.5 my-2.5 border border-gray-300 rounded box-border text-gray-800" />

            <label for="emailInput" class="block">Email</label>
            <input type="email" id="emailInput" required
                   class="w-full p-2.5 my-2.5 border border-gray-300 rounded box-border text-gray-800" />

            <label for="passInput" class="block">Password</label>
            <input type="password" id="passInput" minlength="8" required
                   class="w-full p-2.5 my-2.5 border border-gray-300 rounded box-border text-gray-800" />

            <label for="confirmPassInput" class="block">Confirm Password</label>
            <input type="password" id="confirmPassInput" minlength="8" required
                   class="w-full p-2.5 my-2.5 border border-gray-300 rounded box-border text-gray-800" />

            <p id="errorMsg" class="text-red-500 text-sm mb-2 hidden">Passwords do not match.</p>

            <button type="submit" class="w-full p-3 bg-blue-500 text-white rounded hover:bg-blue-600">Register</button>
            <a href="login.html" class="block text-center w-full p-3 mt-4 bg-gray-200 text-gray-800 rounded hover:bg-gray-300">Back to Login</a>
        </form>
    </div>

    <script>
        const form = document.getElementById("registerForm");
        const pass = document.getElementById("passInput");
        const confirmPass = document.getElementById("confirmPassInput");
        const errorMsg = document.getElementById("errorMsg");

        form.addEventListener("submit", (e) => {
            if (pass.value !== confirmPass.value) {
                e.preventDefault();
                errorMsg.classList.remove("hidden");
            }
        });
        confirmPass.addEventListener("input", () => errorMsg.classList.add("hidden"));
    </script>
</body>
</html>
