<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/style.css">
    <title>User Management</title>
</head>
<body class="font-sans bg-gray-100 min-h-screen m-0 text-gray-800 p-6">
    <div class="bg-white p-6 rounded-lg shadow-lg max-w-3xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <h1 class="font-bold text-3xl">Welcome <span id="welcomeName"></span></h1>
            <a href="login.html" id="logoutLink" class="text-blue-500 hover:underline">Logout</a>
        </div>

        <h2 class="font-semibold text-xl mb-3">All Users</h2>
        <div class="overflow-x-auto">
            <table class="w-full text-left border border-gray-200">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="p-3 border-b border-gray-200">#</th>
                        <th class="p-3 border-b border-gray-200">Username</th>
                        <th class="p-3 border-b border-gray-200">Email</th>
                        <th class="p-3 border-b border-gray-200">Birth Date</th>
                        <th class="p-3 border-b border-gray-200">Role</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody"></tbody>
            </table>
        </div>
    </div>
    <script type="module" src="userManagement.js"></script>
</body>
</html>
